name: NUFC journalist bot

on:
  schedule:
    - cron: "*/30 * * * *"   # restart the loop periodically; the loop itself polls every 5 min
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit state.json back to the repo

concurrency:
  group: nufc-bot
  cancel-in-progress: true    # never let two loops run at once (prevents double-posting)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 255      # a bit over the 4h self-poll loop below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore X session cookies
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
        run: printf '%s' "$X_COOKIES_JSON" > cookies.json

      - name: Run bot on a self-poll loop
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          PERSIST_GIT: "1"    # tells bot.py to commit + push state itself, per account
        run: |
          git config user.name "nufc-bot"
          git config user.email "nufc-bot@users.noreply.github.com"
          # GitHub throttles scheduled starts, so each started job self-polls
          # every 5 min for ~4h. bot.py commits+pushes state after each account
          # that posts, so even a cancelled/overlapping run can't double-post.
          END=$(( $(date +%s) + 4*60*60 ))
          while true; do
            python bot.py || true
            [ "$(date +%s)" -ge "$END" ] && break
            sleep 300
          done
