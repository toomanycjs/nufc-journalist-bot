name: NUFC journalist bot

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum; often runs slower under load)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit state.json back to the repo

concurrency:
  group: nufc-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 255      # a bit over the 4h self-poll loop below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore X session cookies
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
        run: printf '%s' "$X_COOKIES_JSON" > cookies.json

      - name: Run bot on a self-poll loop
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
        run: |
          git config user.name "nufc-bot"
          git config user.email "nufc-bot@users.noreply.github.com"
          # GitHub throttles scheduled starts to roughly hourly, so instead of
          # relying on that, each started job self-polls every 5 min for ~4h.
          # The concurrency group (above) keeps exactly one restart queued, which
          # begins the instant this job ends -> near-continuous 5-min coverage.
          END=$(( $(date +%s) + 4*60*60 ))
          while true; do
            python bot.py || true
            git add state.json
            if ! git diff --staged --quiet; then
              git commit -q -m "Update state [skip ci]"
              git pull -q --rebase --autostash || true
              git push -q || true
            fi
            [ "$(date +%s)" -ge "$END" ] && break
            sleep 300
          done
