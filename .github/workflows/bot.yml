name: NUFC journalist bot

on:
  # Primary trigger: an external cron (cron-job.org) POSTs to the workflow
  # dispatch API every 5 minutes. GitHub runs dispatched jobs promptly, unlike
  # its own throttled schedule.
  workflow_dispatch:
  # Safety net: if the external trigger ever stops, still run every 2 hours.
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write             # bot.py commits state.json back to the repo

concurrency:
  group: nufc-bot
  cancel-in-progress: false   # runs are short and rarely overlap; queue, never cancel

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore X session cookies
        env:
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
        run: printf '%s' "$X_COOKIES_JSON" > cookies.json

      - name: Run bot
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          PERSIST_GIT: "1"    # bot.py commits + pushes state itself (per account)
        run: |
          git config user.name "nufc-bot"
          git config user.email "nufc-bot@users.noreply.github.com"
          python bot.py
